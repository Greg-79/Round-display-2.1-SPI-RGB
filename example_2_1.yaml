number:
  - platform: template
    optimistic: true
    name: arc_number
    id: arc_number
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 50
    on_value:
      then:
        - lvgl.arc.update:
            id: page2_arc
            value: !lambda return x;
        - lvgl.label.update:
            id: page2_value
            text: 
              format: "%.0f"
              args: [ 'x' ] 

button:
