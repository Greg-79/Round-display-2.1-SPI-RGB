              width: 3
              #pad_all: 4
            indicator:
              arc_color: 0x00bbbb
              arc_width: 6
              #arc_opa: 80%            
    - id: page_arc
      widgets:
        - arc:
            id: page2_arc
            align: center
            width: 400
            height: 400
            min_value: 0
            max_value: 100
