            id: day
            align: CENTER
            text_color: 0x0000FF #87CEEB
            y: -58           
        - label:
            text_font: font_30
            id: date
            align: CENTER
            text_color: 0x0000FF #87CEEB
            y: 58
# рабочая часть        
        - arc: # минутная дуга
            align: center
            height: 365
            width: 365
            arc_width: 3
            id: arc_m
            rotation: 270
            #value: 75
            min_value: 0
            max_value: 60
            start_angle: 0
            end_angle: 360
            adjustable: true
            arc_opa: 50%
            arc_color: 0x363535
