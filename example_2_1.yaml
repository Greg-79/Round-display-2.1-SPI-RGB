time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Moscow #"MSK-2MSD,M3.5.0/2,M10.5.0/3"
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update
            
script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: display_time
          text: !lambda |-
            static char dateBuf[20];
            auto now = id(sntp_time).now();
            int dateHour = id(sntp_time).now().hour;
            int dateMinute = id(sntp_time).now().minute;
            sprintf(dateBuf, "%02d:%02d", dateHour, dateMinute);
            return dateBuf;
      - lvgl.arc.update:
          id: arc_m
          value: !lambda |-
            auto now = id(sntp_time).now();
            int dateMinute = id(sntp_time).now().minute;
            return dateMinute;
      - lvgl.arc.update:
          id: arc_hour
          value: !lambda |-
            auto now = id(sntp_time).now();
            //int dateHour = id(sntp_time).now().hour;
            return std::fmod(now.hour, 12);
            //return dateHour - 12;
      - lvgl.label.update:
          id: day
          text: !lambda |-
            auto now = id(sntp_time).now();
            static const char * const day_names[] = {"Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"};
            return day_names[id(sntp_time).now().day_of_week-1];
      - lvgl.label.update:
          id: date
          text: !lambda |-
            //static const char * const mon_names[] = {"Января", "Февраля", "Марта", "Апреля", "Мая", "Июня", "Июля", "Августа", "Сентября", "Октября", "Ноября", "Декабря"};
            static const char * const mon_names[] = {"01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"};
            static char date_buf[20];
            auto now = id(sntp_time).now();
            snprintf(date_buf, sizeof(date_buf), "%2d %s %2d", now.day_of_month, mon_names[now.month-1], now.year);
            return date_buf;
